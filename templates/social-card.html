<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Rebuilt Social Card</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #ffffff;
      font-family: Inter, "SF Pro Display", "Helvetica Neue", Arial, sans-serif;
      color: #101820;
    }

    .artboard {
      width: 1080px;
      height: 1080px;
      position: relative;
      overflow: hidden;
      padding: 72px;
      background: #eef4f3;
      display: grid;
      grid-template-rows: auto 1fr auto;
      gap: 36px;
    }

    .tag {
      width: fit-content;
      padding: 14px 22px;
      border: 2px solid #101820;
      border-radius: 999px;
      font-size: 28px;
      font-weight: 700;
    }

    h1 {
      margin: 0;
      align-self: center;
      font-size: 86px;
      line-height: 1.02;
      letter-spacing: 0;
      max-width: 850px;
    }

    .meta {
      display: flex;
      justify-content: space-between;
      align-items: end;
      gap: 32px;
      font-size: 28px;
      line-height: 1.25;
      color: #526170;
    }
  </style>
</head>
<body>
  <main class="artboard" data-artwork>
    <div class="tag">PUBLISH READY</div>
    <h1>Clean Social Card Headline</h1>
    <footer class="meta">
      <span>Confirmed copy, vector layout</span>
      <strong>4K / 3x PNG</strong>
    </footer>
  </main>
</body>
</html>
