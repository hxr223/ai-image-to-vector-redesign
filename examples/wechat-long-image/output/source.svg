  <text x="176" y="2118" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#526170" >Constant context switching</text>
  <text x="590" y="2118" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#526170" >Long blocks of focus</text>
  <text x="86" y="2286" font-family="Inter, Arial, sans-serif" font-size="24" font-weight="500" fill="#ffffff" >This example demonstrates confirmed text, vector cards, and a 4K-safe long PNG export.</text>
